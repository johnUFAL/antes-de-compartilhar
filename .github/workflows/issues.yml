name: Criar Issues em Massa

on:
  push:
    branches:
      - main

jobs:
  criar-multiplas-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Ler arquivos e criar issues sem duplicar
        run: |
          for arquivo in issues-gerais/*.md; do
            echo "------------------------------------------------"
            echo "Processando o arquivo: $arquivo"
            
            # 1. Pega a primeira linha que NÃO esteja em branco no arquivo para ser o título
            TITULO_BRUTO=$(grep -m 1 -v '^$' "$arquivo" || true)
            
            # Limpa os caracteres '## ' ou '### ' do início do título caso existam
            TITULO=$(echo "$TITULO_BRUTO" | sed 's/^#*\s*//')
            
            # Se mesmo assim o título for vazio, avisa e pula para o próximo arquivo
            if [ -z "$TITULO" ]; then
              echo "Erro: O arquivo $arquivo está vazio ou sem título. Pulando..."
              continue
            fi
            
            # 2. Verifica se já existe uma issue aberta com este título exato para evitar duplicadas
            CHECK_DUPLICADA=$(gh issue list --search "$TITULO" --state open --json title --jq '..title')
            
            if [ "$CHECK_DUPLICADA" = "$TITULO" ]; then
              echo "Aviso: A issue '$TITULO' já existe aberta no GitHub. Pulando..."
              continue
            fi
            
            # 3. Pega as labels e limpa o texto
            LABELS_LINHA=$(grep -i "\*\*Labels:\*\*" "$arquivo" || true)
            LABELS=$(echo "$LABELS_LINHA" | sed -e 's/\*\*Labels:\*\*//I' -e 's/`//g' -e 's/ //g')
            
            # 4. Pega o corpo da mensagem (tudo após o título)
            CORPO=$(tail -n +2 "$arquivo")
            
            # 5. Cria a issue aplicando as etiquetas automaticamente
            if [ -n "$LABELS" ]; then
              echo "Criando issue: $TITULO com as labels: $LABELS"
              echo "$CORPO" | gh issue create --title "$TITULO" --body-file - --label "$LABELS" || echo "$CORPO" | gh issue create --title "$TITULO" --body-file -
            else
              echo "Criando issue sem labels: $TITULO"
              echo "$CORPO" | gh issue create --title "$TITULO" --body-file -
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
